name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/final-ui
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: HaniaION-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish permanent preview download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HaniaION-preview.apk
          gh release view preview-latest >/dev/null 2>&1 || gh release create preview-latest --title "HaniaION Android Preview" --notes "הגרסה העדכנית מענף feature/final-ui" --prerelease --target "$GITHUB_SHA"
          gh release upload preview-latest HaniaION-preview.apk --clobber
