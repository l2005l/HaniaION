plugins { id 'com.android.application' }

android {
    namespace 'com.haniaion.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.haniaion.app'
        minSdk 26
        targetSdk 35
        versionCode 30100
        versionName '3.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
